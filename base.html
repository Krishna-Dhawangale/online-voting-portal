<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Online Voting Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #e0f2fe 0, transparent 55%),
                        radial-gradient(circle at bottom right, #fef3c7 0, transparent 55%),
                        #0f172a;
            min-height: 100vh;
            color: #0f172a;
        }

        .app-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .app-navbar {
            background: rgba(15, 23, 42, 0.96);
            backdrop-filter: blur(18px);
        }

        .app-navbar .navbar-brand span.badge {
            border-radius: 999px;
        }

        .app-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem 3rem;
        }

        @media (min-width: 992px) {
            .app-main {
                padding-top: 3rem;
            }
        }

        .auth-layout,
        .content-card {
            width: 100%;
            max-width: 960px;
        }

        .card-surface {
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.12), transparent 60%),
                        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.08), transparent 60%),
                        #ffffff;
            border-radius: 1.25rem;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow:
                0 22px 60px rgba(15, 23, 42, 0.35),
                0 0 0 1px rgba(148, 163, 184, 0.15);
            overflow: hidden;
        }

        .card-accent {
            position: relative;
            background: radial-gradient(circle at 10% 0, rgba(56, 189, 248, 0.4), transparent 55%),
                        radial-gradient(circle at 90% 100%, rgba(52, 211, 153, 0.35), transparent 55%),
                        linear-gradient(135deg, #0f172a, #020617);
            color: #e5e7eb;
        }

        .badge-pill {
            border-radius: 999px;
        }

        .field-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #4b5563;
        }

        .form-control-lg {
            border-radius: 0.9rem;
            border-color: #d1d5db;
            padding: 0.65rem 0.9rem;
        }

        .form-control-lg:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.35);
        }

        .btn-primary {
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: 0.02em;
            box-shadow: 0 16px 35px rgba(37, 99, 235, 0.45);
        }

        .btn-outline-light {
            border-radius: 999px;
        }

        .subtle-link {
            color: #6b7280;
            font-size: 0.9rem;
        }

        .subtle-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }

        .subtle-link a:hover {
            text-decoration: underline;
        }

        .results-badge {
            border-radius: 999px;
        }

        .footer-muted {
            color: rgba(148, 163, 184, 0.9);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <nav class="navbar navbar-expand-lg navbar-dark app-navbar shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-semibold d-flex align-items-center gap-2" href="{{ url_for('login') }}">
                    <span class="badge bg-light text-primary fw-bold px-2 py-1 badge-pill">OV</span>
                    <span class="d-none d-sm-inline">Online Voting Portal</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('register') }}">Register</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('vote') }}">Vote</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('result') }}">Results</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{{ url_for('admin') }}">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <main class="app-main">
            <div class="container">
                {% block content %}{% endblock %}
            </div>
        </main>

        <footer class="py-3">
            <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                <span class="footer-muted">© {{ 2025 }} Online Voting Portal</span>
                <span class="footer-muted">Secure digital voting experience</span>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
